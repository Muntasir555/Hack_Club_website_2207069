<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HAC KUET</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="join.css"> <!-- Reuse form styles -->
</head>
<body>
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>
    
    <header class="navbar">
        <a href="index.html" class="logo"><span class="logo-accent">HAC</span> KUET</a>
        <nav class="nav-links">
            <a href="join.html" class="nav-item">Join Us</a>
        </nav>
    </header>

    <main class="main-content center-form">
        <div class="glass-container form-container">
            <h2>Welcome <span class="text-gradient">Back</span></h2>
            <p>Login to your account.</p>
            
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" required placeholder="e.g. 2107000">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                
                <div id="message" class="message"></div>
                
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
