<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | HAC KUET</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>
    
    <header class="navbar">
        <a href="index.html" class="logo"><span class="logo-accent">HAC</span> Admin</a>
        <nav class="nav-links">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="section pt-10">
            <h1 class="hero-title" style="font-size: 2.5rem;">User <span class="text-gradient">Management</span></h1>
            
            <div class="tabs-container mt-4">
                <button class="tab-btn active" data-tab="all">All Users</button>
                <button class="tab-btn" data-tab="pending">Pending Approvals</button>
                <button class="tab-btn" data-tab="members">Club Members</button>
                <button class="tab-btn" data-tab="notices">Notice Board</button>
            </div>

            <div id="usersContent" class="glass-container mt-4 p-4 tab-content active">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <div id="noticesContent" class="glass-container mt-4 p-4 tab-content" style="display: none;">
                <h2 style="margin-bottom: 1rem; font-size: 1.5rem;">Post a New Notice</h2>
                <form id="noticeForm" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                    <input type="text" id="noticeTitle" placeholder="Notice Title" required style="padding: 0.8rem; border-radius: 4px; border: none; background: rgba(255,255,255,0.1); color: #fff;">
                    <textarea id="noticeContent" placeholder="Notice Content..." rows="4" required style="padding: 0.8rem; border-radius: 4px; border: none; background: rgba(255,255,255,0.1); color: #fff;"></textarea>
                    <button type="submit" class="btn btn-primary" style="align-self: flex-start;">Post Notice</button>
                </form>

                <h2 style="margin-bottom: 1rem; font-size: 1.5rem;">Existing Notices</h2>
                <div id="noticesList" style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
